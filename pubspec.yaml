name: depositguard
description: >-
  DepositGuard – stop rental security-deposit disputes with tamper-evident,
  jointly signed move-in / move-out evidence and a fair, rule-based
  deduction calculator. Runs on Web, Android, iOS and Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
